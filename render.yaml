services:
  - type: web
    name: mtali-agro-backend
    env: python
    plan: free
    region: oregon
    # Ensure commands run from the backend directory so requirements are found
    buildCommand: cd backend && pip install -r requirements.txt
    # Apply database migrations before starting the Django application.
    startCommand: cd backend && python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: DJANGO_SECRET_KEY
        value: ""
      - key: CLOUDINARY_URL
        value: ""

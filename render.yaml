services:
  - type: web
    name: mtali-agro-backend
    env: python
    plan: free
    region: oregon
    # Ensure commands run from the backend directory so requirements are found
    buildCommand: cd backend && pip install -r requirements.txt
    # Use gunicorn --chdir to ensure the Django project folder is on Python path
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4
    envVars:
      - key: DJANGO_SECRET_KEY
        value: ""
      - key: DATABASE_URL
        value: ""
      - key: CLOUDINARY_URL
        value: ""
